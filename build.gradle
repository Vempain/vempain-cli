plugins {
    id 'application'
    id 'java'
    id 'jacoco'
}

group = 'fi.poltsi.vempain'
version = libs.versions.release.get()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = "https://maven.pkg.github.com/Vempain/vempain-auth"
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
            password = project.findProperty("gpr.token") ?: System.getenv("GITHUB_TOKEN")
        }
    }
    maven {
        url = "https://maven.pkg.github.com/Vempain/vempain-file-backend"
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
            password = project.findProperty("gpr.token") ?: System.getenv("GITHUB_TOKEN")
        }
    }
    maven {
        url = "https://maven.pkg.github.com/Vempain/vempain-admin-backend"
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
            password = project.findProperty("gpr.token") ?: System.getenv("GITHUB_TOKEN")
        }
    }
}

dependencies {
    // Add Vempain API package dependencies when backend-specific typed DTO usage is enabled.
    // implementation "fi.poltsi.vempain:vempain-auth-core:${libs.versions.vempain.auth.get()}"
    // implementation "fi.poltsi.vempain:vempain-auth-api:${libs.versions.vempain.auth.get()}"
    // implementation "fi.poltsi.vempain:vempain-file-backend-api:${libs.versions.vempain.file.get()}"
    // implementation "fi.poltsi.vempain:vempain-admin-backend-api:${libs.versions.vempain.admin.get()}"
    implementation "com.beust:jcommander:${libs.versions.jcommander.get()}"
    implementation "org.jline:jline:${libs.versions.jline.get()}"
    implementation "org.json:json:${libs.versions.json.get()}"
    testImplementation "org.junit.jupiter:junit-jupiter:${libs.versions.junit.get()}"
    testImplementation "org.junit.platform:junit-platform-launcher:${libs.versions.junit.get()}"
    testImplementation "org.mockito:mockito-junit-jupiter:${libs.versions.mockito.get()}"
}

application {
    mainClass = 'fi.poltsi.vempain.cli.VempainFileCliApplication'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = libs.versions.jacoco.get()
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            element = 'PACKAGE'
            includes = ['fi.poltsi.vempain.cli']
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
        }
    }
}

jar {
    manifest {
        attributes('Main-Class': application.mainClass.get())
    }
}

tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Builds a runnable fat jar for the CLI module.'
    archiveFileName = 'vf-cli.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn configurations.runtimeClasspath
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    manifest {
        attributes('Main-Class': application.mainClass.get())
    }
}


